<div id="brand-detail-overlay" class="pbi-overlay" onclick="closeBrandDetailOutside(event)" style="display:none">
  <div class="pbi-modal" style="max-width:900px;width:95vw;max-height:90vh;overflow:hidden;display:flex;flex-direction:column">
    <!-- Header -->
    <div class="pbi-header" style="flex-shrink:0">
      <div style="display:flex;align-items:center;gap:12px">
        <div id="brand-detail-icon" class="brand-icon" style="width:40px;height:40px;font-size:14px;font-weight:700;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff"></div>
        <div>
          <div id="brand-detail-title" style="font-size:18px;font-weight:700;color:var(--text)"></div>
          <div id="brand-detail-subtitle" style="font-size:12px;color:var(--text3);margin-top:1px"></div>
        </div>
      </div>
      <button class="pbi-close" onclick="closeBrandDetail()">✕</button>
    </div>

    <!-- Stats row -->
    <div id="brand-detail-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0"></div>

    <!-- Toolbar -->
    <div style="display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap">
      <div id="brand-detail-cats" style="display:flex;gap:6px;flex-wrap:wrap;flex:1"></div>
      <div class="search-bar" style="width:200px">
        <svg fill="none" height="13" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="13"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line></svg>
        <input id="brand-detail-search" oninput="filterBrandDetailProducts(this.value)" placeholder="Search products..." type="text"/>
      </div>
    </div>

    <!-- Products grid -->
    <div id="brand-detail-products" style="overflow-y:auto;flex:1;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-content:start"></div>

    <!-- Footer -->
    <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--surface2)">
      <span id="brand-detail-count" style="font-size:12px;color:var(--text3)"></span>
      <a id="brand-detail-link" href="https://www.janbros.com" target="_blank" style="font-size:12px;color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:4px">
        View on janbros.com 
        <svg fill="none" height="11" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="11"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
      </a>
    </div>
  </div>
</div>
