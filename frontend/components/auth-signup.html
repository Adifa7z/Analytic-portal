<div class="auth-screen" id="auth-signup">
<div class="auth-bg-orb o1"></div>
<div class="auth-bg-orb o2"></div>
<div class="auth-card">
<div class="auth-logo">

<div class="auth-logo-text" img="assets/cognexiaai-logo.png" style="display:flex;align-items:center;gap:8px">
<span data-i18n="enterprise_portal">Enterprise Portal</span>
</div>
</div>
<div class="auth-title" data-i18n="signup_title">Create Account</div>
<div class="auth-sub" data-i18n="signup_sub">Join the Jan &amp; Bros enterprise platform</div>
<div class="auth-field">
<label class="auth-label" data-i18n="fullname_label">Full Name</label>
<input class="auth-input" placeholder="Your full name" type="text"/>
</div>
<div class="auth-field">
<label class="auth-label" data-i18n="email_label">Email Address</label>
<input class="auth-input" placeholder="you@company.com" type="email"/>
</div>
<div class="auth-field">
<label class="auth-label" data-i18n="password_label">Password</label>
<input class="auth-input" placeholder="Min. 8 characters" type="password"/>
</div>
<button class="auth-btn" data-i18n="create_account_btn" onclick="doLogin()">Create Account</button>
<div class="auth-divider"><span data-i18n="or_divider">OR</span></div>
<div class="auth-switch" data-i18n="have_account">Already have an account? <a data-i18n="signin_link" onclick="showLogin()">Sign in</a></div>
</div>
</div>
