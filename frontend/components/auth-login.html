<div class="auth-screen active" id="auth-login">
<div class="auth-bg-orb o1"></div>
<div class="auth-bg-orb o2"></div>
<div class="auth-bg-orb o3"></div>
<div class="auth-card">
<div class="auth-logo">
<div class="auth-logo-mark">J&amp;B</div>
<div class="auth-logo-text">
<strong>Jan &amp; Bros</strong>
<span data-i18n="enterprise_portal">AnalyticsEnterprise Portal</span>
</div>
</div>
<div class="auth-title" data-i18n="login_title">Welcome back</div>
<div class="auth-sub" data-i18n="login_sub">Sign in to your enterprise account</div>
<div class="auth-field">
<label class="auth-label" data-i18n="email_label">Email Address</label>
<input class="auth-input" data-i18n-placeholder="email_ph" id="login-email" placeholder="admin@janbros.com" type="email"/>
</div>
<div class="auth-field">
<label class="auth-label" data-i18n="password_label">Password</label>
<input class="auth-input" data-i18n-placeholder="pass_ph" id="login-pass" placeholder="••••••••" type="password"/>
</div>
<button class="auth-btn" data-i18n="signin_btn" onclick="doLogin()">Sign In</button>
<div style="margin-top:12px;text-align:center">
<span data-i18n="demo_hint" style="font-size:12px;color:rgba(255,255,255,0.35)">Demo: any email / any password</span>
</div>
<div class="auth-divider"><span data-i18n="or_divider">OR</span></div>
<div class="auth-switch" data-i18n="no_account">Don't have an account? <a data-i18n="signup_link" onclick="showSignup()">Create one</a></div>
<div style="display:flex;justify-content:center;margin-top:20px">
<div class="lang-toggle" style="border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.06)">
<button class="lang-btn active" onclick="setAuthLang('en',this)" style="color:rgba(255,255,255,0.6)">EN</button>
<button class="lang-btn" onclick="setAuthLang('ar',this)" style="color:rgba(255,255,255,0.6)">AR</button>
</div>
</div>
</div>
</div>
